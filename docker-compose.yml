services:
  floci:
    image: floci/floci:latest
    container_name: floci
    restart: always
    ports:
      - "4566:4566"           # All AWS API calls: S3, DynamoDB, SQS, SNS, Lambda, SES, IAM, etc.
      - "7001-7099:7001-7099" # RDS proxy ports (Postgres/MySQL/MariaDB)
      - "6380-6399:6380-6399" # ElastiCache proxy ports (Redis/Valkey)
    volumes:
      - ./floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_SERVICES_DOCKER_NETWORK: floci_default
      SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: pgvector/pgvector:pg16
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: pgvector/pgvector:pg16

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floci-dashboard
    restart: always
    ports:
      - "3050:3050"
    environment:
      - FLOCI_ENDPOINT=http://floci:4566
      - FLOCI_NETWORK_MODE=local
      - FLOCI_PUBLIC_HOST=localhost
      - FLOCI_CONFIG_STORAGE_PATH=/app/data/floci-ui-config.json
    volumes:
      - ./dashboard-data:/app/data
    depends_on:
      - floci

networks:
  default:
    name: floci_default
